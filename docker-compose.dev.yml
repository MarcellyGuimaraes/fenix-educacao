# Modo de desenvolvimento (opcional): código montado do host, com reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Não é um docker-compose.override.yml de propósito: esse seria carregado
# automaticamente e anularia o modo padrão otimizado.
services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      APP_OPTIMIZE: "false"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    volumes:
      - ./backend:/var/www/html
      # vendor/ num volume nomeado (fora do bind mount): evita ler milhares de
      # arquivos pelo compartilhamento Windows <-> VM a cada request
      - backend_vendor:/var/www/html/vendor

  nginx:
    volumes:
      - ./backend/public:/var/www/html/public:ro

  frontend:
    build:
      target: dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
      VITE_USE_POLLING: "true"
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  backend_vendor:
