; Ajustes de runtime. Os valores ${...} vêm do ambiente do container
; (padrões definidos no Dockerfile, sobrescritos pelo docker-compose.dev.yml).

; OPcache: no modo padrão o código está na imagem e não muda, então não
; revalida timestamps. No modo dev, PHP_OPCACHE_VALIDATE_TIMESTAMPS=1.
opcache.enable=1
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16

; PCOV só é útil para cobertura: desligado por padrão, ligado com
; -e PHP_PCOV_ENABLED=1 no comando de testes.
pcov.enabled=${PHP_PCOV_ENABLED}

realpath_cache_size=4096K
realpath_cache_ttl=600
